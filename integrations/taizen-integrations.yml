note: >-
  DIRECTION MATTERS. Everything below is INBOUND — these are third-party APIs that Taizen CONSUMES on
  the customer's behalf, and the credentials/scopes listed are what Taizen REQUESTS FROM the
  customer's tools. Taizen issues none of them. This file is deliberately not wired as an
  authentication or scopes artifact, because crediting Taizen with publishing an OAuth scope
  vocabulary it merely consumes would be false.
