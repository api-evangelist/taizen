mcp_connector_note: >-
  The provider's shipped plugin config
  (https://github.com/taizen-ai/taizen-claude-plugins/blob/main/plugins/taizen-gtm-skills/.mcp.json)
  additionally registers 20 third-party MCP endpoints alongside Taizen's own, including Salesforce,
  HubSpot, Gong, Slack, Google Drive, Notion, Linear, GitHub, Glean, Amplitude, Mixpanel, Intercom,
  Zendesk, Outreach, Salesloft, LinkedIn, Clearbit, ZoomInfo, G2 and 6sense. Those are other
  companies' endpoints, recorded here only as evidence of Taizen's stated "connect once instead of
  15+ individual MCP connectors" positioning.
