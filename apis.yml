aid: taizen
name: Taizen
description: >-
  Taizen is a managed agentic AI platform for go-to-market teams that automates win/loss analysis,
  competitive intelligence and sales-asset production. Its agents continuously read recorded sales
  calls (Gong, Fireflies, tl;dv, Granola, Genesys Cloud), CRM deal data (Salesforce, HubSpot, Attio,
  Clari), survey and review signal (Typeform, SurveyMonkey, G2) and existing collateral (Google
  Drive, SharePoint) to detect recurring objections and competitor moves, then auto-generate
  battlecards, rep-training drills and AI-roleplay scenarios, and deliver them into Slack. Taizen
  also books and runs AI-led interviews with lost buyers. Its machine surface is not a REST API but
  an agent surface: a remote, OAuth-protected MCP server at eu.mcp.usetaizen.com positioned as one
  connection in place of fifteen-plus individual MCP connectors, and a first-party open-source Claude
  plugin of thirty GTM Agent Skills. Backed by Techstars, the company emphasizes built-in governance,
  no model-vendor lock-in, SOC 2 / ISO 27001 / GDPR posture with an EU data region, and open sources
  supporting retrieval tooling on GitHub.
