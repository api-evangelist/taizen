apis:
- name: Taizen MCP Server
  description: >-
    Taizen's remote Model Context Protocol server — the company's only machine-callable surface. Per
    the provider's own manifest it lets an agent connect once instead of wiring fifteen-plus
    individual MCP connectors: it indexes the customer's Gong calls, CRM records and documents so any
    teammate can query every source through one connection, and it schedules recurring AI agents
    described in natural language, delivering results to Slack, Google Drive or Notion. Protected by
    OAuth 2.1 with PKCE and dynamic client registration; tools/list is auth-gated. An EU region is
    live; the US region advertised in the shipped plugin config is not currently serving.
  humanURL: https://docs.usetaizen.com/
